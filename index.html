<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torque & BOM Finder Pro</title>
    <!-- SheetJS library for Excel processing -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; padding: 20px; max-width: 950px; margin: 0 auto; background-color: #f0f2f5; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 20px; }
        h2 { color: #1a73e8; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        h3 { color: #333; margin-top: 25px; border-bottom: 1px solid #ddd; padding-bottom: 5px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #444; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccd0d5; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        button { background-color: #1a73e8; color: white; padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #1557b0; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        
        #torqueResult { margin-top: 20px; padding: 15px; border-radius: 6px; display: none; text-align: center; }
        .success { background-color: #e6f4ea; color: #1e8e3e; border: 1px solid #ceead6; }
        .error { background-color: #fce8e6; color: #d93025; border: 1px solid #fad2cf; }
        .rounding-info { display: block; font-size: 0.8em; margin-top: 5px; color: #666; font-weight: normal; }

        .result-section { display: none; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #fff; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f8f9fa; color: #555; }
        tr:nth-child(even) { background-color: #fafafa; }
        
        .brake-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; background-color: #fffde7; border: 1px solid #fbc02d; padding: 15px; border-radius: 6px; margin-top: 10px; }
        .price-tag { font-weight: bold; color: #2e7d32; }
        .total-price-tag { font-weight: bold; color: #d93025; }
        .shaft-badge { display: inline-block; background: #e3f2fd; color: #0d47a1; padding: 2px 8px; border-radius: 4px; font-size: 0.9em; font-weight: bold; }
        
        #statusIndicator { margin-bottom: 20px; padding: 10px; border-radius: 6px; font-weight: bold; font-size: 0.9em; }
        .status-loading { background: #fff3cd; color: #856404; }
        .status-ready { background: #d4edda; color: #155724; }
        .status-error { background: #f8d7da; color: #721c24; }

        .checkbox-group { margin: 15px 0; background: #f8f9fa; padding: 10px; border-radius: 6px; border: 1px solid #eee; }
        .checkbox-group label { display: flex; align-items: center; cursor: pointer; font-weight: 600; color: #444; }
        .checkbox-group input { width: auto; margin-right: 12px; transform: scale(1.2); }
    </style>
</head>
<body>

<div class="card">
    <h2>Torque & BOM Finder Pro</h2>
    
    <div id="statusIndicator" class="status-loading">⌛ Initializing database...</div>

    <div class="input-group">
        <label for="shutterType">1. Roller Shutter Type</label>
        <select id="shutterType">
            <option value="75mm22g">75mm22g</option>
            <option value="75mm22gr">75mm22gr</option>
            <option value="75mm20g">75mm20g</option>
            <option value="75mm20gr">75mm20gr</option>
            <option value="75mm18g">75mm18g</option>
            <option value="75mm18gr">75mm18gr</option>
            <option value="95mm">95mm</option>
            <option value="100mm">100mm</option>
        </select>
    </div>

    <div style="display: flex; gap: 15px;">
        <div class="input-group" style="flex: 1;">
            <label for="widthInput">Width (mm)</label>
            <input type="number" id="widthInput" placeholder="e.g. 1900">
        </div>
        <div class="input-group" style="flex: 1;">
            <label for="heightInput">Height (mm)</label>
            <input type="number" id="heightInput" placeholder="e.g. 2000">
        </div>
    </div>

    <div class="checkbox-group">
        <label>
            <input type="checkbox" id="calcBomPrice"> Include BOM (Bill of Materials) Price
        </label>
    </div>

    <button id="lookupBtn" disabled>Run Full Calculation</button>

    <div id="torqueResult"></div>

    <div id="brakeSection" class="result-section">
        <h3>Recommended Safety Brake</h3>
        <div id="brakeDisplay" class="brake-grid"></div>
    </div>

    <div id="motorSection" class="result-section">
        <h3>Compatible Motors</h3>
        <table id="motorTable">
            <thead>
                <tr>
                    <th>Stock Code</th>
                    <th>Description</th>
                    <th>Shaft Size</th>
                    <th>Motor Price</th>
                    <th class="total-col" style="display:none;">Total Inc. BOM</th>
                </tr>
            </thead>
            <tbody id="motorBody"></tbody>
        </table>
        <p id="noMotorMsg" style="display:none; color: #666; font-style: italic;">No motors found for this torque range.</p>
    </div>
</div>

<script>
    const FILE_NAME = 'Online logic all tables.xlsx';

    let torqueData = null;
    let motorData = null;
    let brakeData = null;
    let bomPriceData = null;

    window.addEventListener('DOMContentLoaded', async () => {
        const status = document.getElementById('statusIndicator');
        try {
            const response = await fetch(encodeURI(FILE_NAME));
            if (!response.ok) throw new Error(`Could not find "${FILE_NAME}".`);

            const data = await response.arrayBuffer();
            const workbook = XLSX.read(new Uint8Array(data), { type: 'array' });
            
            // Map the sheets based on your specific Excel tab names
            const tName = workbook.SheetNames.find(n => n.trim() === "All torque charts");
            const mName = workbook.SheetNames.find(n => n.trim() === "Motor list");
            const bName = workbook.SheetNames.find(n => n.trim() === "Safety brake");
            const pName = workbook.SheetNames.find(n => n.trim() === "75mm 20G price");

            if (tName) torqueData = XLSX.utils.sheet_to_json(workbook.Sheets[tName], { header: 1, defval: "" });
            if (mName) motorData = XLSX.utils.sheet_to_json(workbook.Sheets[mName], { header: 1, defval: "" });
            if (bName) brakeData = XLSX.utils.sheet_to_json(workbook.Sheets[bName], { header: 1, defval: "" });
            if (pName) bomPriceData = XLSX.utils.sheet_to_json(workbook.Sheets[pName], { header: 1, defval: "" });

            status.innerHTML = "✅ Database Loaded & Ready";
            status.className = "status-ready";
            document.getElementById('lookupBtn').disabled = false;

        } catch (err) {
            status.innerHTML = "❌ Error: " + err.message;
            status.className = "status-error";
        }
    });

    document.getElementById('lookupBtn').addEventListener('click', function() {
        const selectedType = document.getElementById('shutterType').value.toLowerCase();
        const inputWidth = parseFloat(document.getElementById('widthInput').value);
        const inputHeight = parseFloat(document.getElementById('heightInput').value);
        const shouldCalcBom = document.getElementById('calcBomPrice').checked;

        if (isNaN(inputWidth) || isNaN(inputHeight)) {
            showResult("Please enter numeric values.", "error");
            return;
        }

        try {
            // --- 1. TORQUE CALCULATION ---
            const headerRow = torqueData[2]; 
            let availableWidths = [];
            for (let j = 2; j < headerRow.length; j++) {
                let val = parseFloat(headerRow[j]);
                if (!isNaN(val)) availableWidths.push({ val: val, index: j });
            }
            const widthMatch = availableWidths.sort((a,b)=>a.val-b.val).find(w => w.val >= inputWidth);

            let availableHeights = [];
            for (let i = 3; i < torqueData.length; i++) {
                const rowType = String(torqueData[i][0] || "").toLowerCase().replace(/\s/g, '');
                if (rowType === selectedType) {
                    let hVal = parseFloat(torqueData[i][1]);
                    if (!isNaN(hVal)) availableHeights.push({ val: hVal, index: i });
                }
            }
            const heightMatch = availableHeights.sort((a,b)=>a.val-b.val).find(h => h.val >= inputHeight);

            if (!widthMatch || !heightMatch) {
                showResult("Input exceeds chart dimensions.", "error");
                return;
            }

            const calculatedTorque = parseFloat(torqueData[heightMatch.index][widthMatch.index]);
            
            // --- 2. BOM PRICE LOOKUP (Based on your Screenshot) ---
            let currentBomPrice = 0;
            let bomInfoText = "";
            
            if (shouldCalcBom && bomPriceData) {
                // Width lookup: Row 1 (Index 0). Widths start at Column B (Index 1)
                const bomHeader = bomPriceData[0];
                let bomWidthCols = [];
                for (let j = 1; j < bomHeader.length; j++) {
                    // Extract numbers from strings like "w1900"
                    let cellVal = String(bomHeader[j] || "");
                    let num = parseFloat(cellVal.replace(/[^\d.]/g, '')); 
                    if (!isNaN(num)) bomWidthCols.push({ val: num, index: j });
                }
                // Find column where Header >= Input
                const bomWidthMatch = bomWidthCols.sort((a,b)=>a.val-b.val).find(w => w.val >= inputWidth);

                // Height lookup: Column A (Index 0). Heights start at Row 2 (Index 1)
                let bomHeightRows = [];
                for (let i = 1; i < bomPriceData.length; i++) {
                    let hVal = parseFloat(bomPriceData[i][0]); // Column A
                    if (!isNaN(hVal)) bomHeightRows.push({ val: hVal, index: i });
                }
                // Find row where Column A >= Input
                const bomHeightMatch = bomHeightRows.sort((a,b)=>a.val-b.val).find(h => h.val >= inputHeight);

                if (bomWidthMatch && bomHeightMatch) {
                    const priceValue = bomPriceData[bomHeightMatch.index][bomWidthMatch.index];
                    currentBomPrice = parseFloat(priceValue) || 0;
                    
                    bomInfoText = `
                        <div style="color:#2e7d32; font-weight:bold; margin-top:8px; padding-top:8px; border-top:1px solid #ceead6;">
                            BOM Price (without motor): £${currentBomPrice.toFixed(2)}
                        </div>
                        <div style="font-size:0.8em; color:#666;">
                            (Based on ${bomWidthMatch.val}mm x ${bomHeightMatch.val}mm chart intersection)
                        </div>
                    `;
                } else {
                    bomInfoText = `<div style="color:#d93025; font-size:0.8em; margin-top:5px;">BOM dimensions not found in chart.</div>`;
                }
            }

            // Display Results
            showResult(`
                <div style="font-size:1.4em; font-weight:bold;">Required Torque: ${calculatedTorque} Nm</div>
                <div class="rounding-info">Torque rounded to: ${widthMatch.val}mm x ${heightMatch.val}mm</div>
                ${bomInfoText}
            `, "success");

            const selectedBrake = findSafetyBrake(calculatedTorque);
            findMotors(calculatedTorque, selectedBrake, currentBomPrice);

        } catch (err) {
            showResult("Error during calculation. Please check Excel format.", "error");
            console.error(err);
        }
    });

    function findSafetyBrake(torque) {
        const display = document.getElementById('brakeDisplay');
        document.getElementById('brakeSection').style.display = 'block';
        let selectedBrake = null;

        for (let i = 1; i < brakeData.length; i++) {
            const row = brakeData[i];
            const maxTorqueLimit = parseFloat(row[1]); 

            if (!isNaN(maxTorqueLimit) && torque <= maxTorqueLimit) {
                selectedBrake = {
                    name: row[0],       
                    shaft: row[5],      
                    stockCode: row[7],  
                    price: row[8]       
                };
                break;
            }
        }

        if (selectedBrake) {
            display.innerHTML = `
                <div>
                    <strong>Model:</strong> ${selectedBrake.name}<br>
                    <strong>Stock Code:</strong> ${selectedBrake.stockCode}
                </div>
                <div>
                    <strong>Shaft Size:</strong> <span class="shaft-badge">${selectedBrake.shaft || 'N/A'}</span><br>
                    <strong>Price:</strong> <span class="price-tag">£${selectedBrake.price}</span>
                </div>
            `;
        } else {
            display.innerHTML = `<div style="grid-column: span 2; color:red">No safety brake found for ${torque}Nm.</div>`;
        }
        return selectedBrake;
    }

    function findMotors(torque, selectedBrake, bomPrice) {
        const body = document.getElementById('motorBody');
        const section = document.getElementById('motorSection');
        const totalCols = document.querySelectorAll('.total-col');
        const isBomActive = (bomPrice > 0);
        
        body.innerHTML = "";
        let found = false;

        // Toggle Total Column Visibility
        totalCols.forEach(el => el.style.display = isBomActive ? 'table-cell' : 'none');

        for (let i = 1; i < motorData.length; i++) {
            const row = motorData[i];
            const min = parseFloat(row[5]);
            const max = parseFloat(row[6]);
            const driveType = String(row[8] || "").toLowerCase().trim();

            if (!isNaN(min) && !isNaN(max) && torque >= min && torque <= max) {
                found = true;
                
                let displayShaft = row[7]; 
                if (driveType === "indirect" && selectedBrake) {
                    displayShaft = selectedBrake.shaft; 
                }

                const motorPrice = parseFloat(row[4]) || 0;
                const totalPrice = motorPrice + bomPrice;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${row[0]}</td>
                    <td>${row[2]}</td>
                    <td><span class="shaft-badge">${displayShaft || '-'}</span></td>
                    <td class="price-tag">£${motorPrice.toFixed(2)}</td>
                    <td class="total-col total-price-tag" style="display:${isBomActive ? 'table-cell' : 'none'}">£${totalPrice.toFixed(2)}</td>
                `;
                body.appendChild(tr);
            }
        }

        section.style.display = 'block';
        document.getElementById('motorTable').style.display = found ? 'table' : 'none';
        document.getElementById('noMotorMsg').style.display = found ? 'none' : 'block';
    }

    function showResult(message, type) {
        const resDiv = document.getElementById('torqueResult');
        resDiv.innerHTML = message;
        resDiv.className = type;
        resDiv.style.display = 'block';
    }
</script>

</body>
</html>
